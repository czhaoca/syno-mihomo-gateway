# Syno Mihomo Gateway CI
when:
  event: [push, pull_request]
  branch: [main, master]

steps:
  - name: validate-compose
    image: alpine:3.22
    commands:
      # Needs compose v2 (what DSM Container Manager and local dev run): the
      # deprecated docker/compose image is frozen at v1, which cannot parse the
      # fail-closed ${VAR:?msg} image refs the compose file uses deliberately.
      - apk add --no-cache -q docker-cli-compose
      - docker compose --env-file .env.example config --quiet

  - name: validate-yaml
    image: python:3.12-slim
    commands:
      - pip install --quiet pyyaml
      - python -c "import yaml; yaml.safe_load(open('docker-compose.yml'))"
      - echo "YAML validation passed"

  - name: render-config
    image: python:3.12-slim
    commands:
      # Renders config.template.yaml with .env.example, validates structure, and
      # enforces the CLAUDE.md "no hardcoded DNS/network address" rule.
      - pip install --quiet pyyaml
      - python scripts/ci/render_check.py

  - name: cli-contract
    image: python:3.12-slim
    commands:
      # The CLI contract: scripts/cli/spec.yaml is the source of truth; the
      # committed help.sh/cli.md(en+zh)/CLI.txt(en+zh) must regenerate
      # byte-identical, spec exit codes must match common.sh, and gateway.sh
      # --help must serve the spec text verbatim. Regenerate with --write.
      - pip install --quiet pyyaml
      - python scripts/ci/cli_contract_check.py

  - name: compose-policy
    image: python:3.12-slim
    commands:
      # Image-ref policy: every compose image is a fail-closed env ref (never a
      # hardcoded ref or default fallback), and .env.example ships REGISTRY_MODE=acr
      # (ACR is the default; 'docker' upstream is an explicit opt-in). The acr-vs-docker
      # choice itself lives in the gitignored .env. See docs/configuration.md.
      - pip install --quiet pyyaml
      - python scripts/ci/compose_policy_check.py

  - name: package-check
    image: python:3.12-slim
    commands:
      # Hermetic safeguard test: builds the dev, enduser, and linux release bundles in
      # throwaway repos and proves none can ship a secret (.env / subscription /
      # config.yaml); the enduser bundle also prunes every developer/.md/CI file, ships
      # the installer + .txt guides, contains no identity string, and its leak-gate fails
      # closed on an injected leak; the linux bundle carries both generic entries with
      # the identity gate still fail-closed (--profile pi = warned alias). Needs git to
      # run the real packager.
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends git >/dev/null
      - python scripts/ci/package_check.py

  - name: privacy-check
    image: python:3.12-slim
    commands:
      # Public project/GitHub and Shenzhen ACR references are allowed. Private
      # operational identifiers, credentials, and tracked runtime files are not.
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends git >/dev/null
      - python scripts/ci/privacy_check.py
      - python scripts/ci/privacy_check_test.py

  - name: dsm-shell-tests
    image: alpine:3.22
    commands:
      - sh scripts/ci/dsm_installer_check.sh
      - sh scripts/ci/lifecycle_check.sh
      - sh scripts/ci/auto_update_check.sh
      - sh scripts/ci/cloudflared_check.sh
      - sh scripts/ci/generic_update_check.sh
      - sh scripts/ci/gateway_cli_check.sh
      - sh scripts/ci/seed_provider_check.sh
      - sh scripts/ci/proxy_groups_check.sh
      - sh scripts/ci/full_proxy_check.sh
      - sh scripts/ci/mihomo_entrypoint_check.sh
      - sh scripts/ci/pi_installer_check.sh
      - sh scripts/ci/linux_installer_check.sh
      - sh scripts/validate_release.sh --self-test

  - name: shellcheck
    image: koalaman/shellcheck-alpine:stable
    commands:
      # First parse-check every shell script, then lint the entry points with -x so the
      # sourced modules are analyzed in context: install.sh pulls in scripts/installer/*.sh
      # + scripts/lib/*.sh; auto_update.sh + setup_network.sh pull in their libs.
      # setup_network.sh is now POSIX /bin/sh (no more bash exception).
      - 'for f in $(find . -path ./.git -prune -o -name "*.sh" -print); do sh -n "$f" || exit 1; done'
      - shellcheck -x install.sh install-pi.sh install-linux.sh scripts/gateway.sh scripts/auto_update.sh scripts/pi/auto_update_lite.sh scripts/pi/lite_ctl.sh scripts/install_scheduler.sh scripts/setup_network.sh scripts/render_config.sh scripts/mihomo_entrypoint.sh scripts/package.sh scripts/doctor.sh scripts/state_diff.sh scripts/seed_provider.sh bootstrap.sh scripts/lib/container.sh scripts/lib/targets.sh scripts/lib/geodata.sh scripts/lib/panel.sh scripts/linux/i18n_linux.sh scripts/linux/preflight_linux.sh scripts/validate_release.sh

  - name: ui-build
    image: node:22-slim
    commands:
      # The frontend toolchain (#78). `npm ci` so the lockfile is
      # authoritative - a CI build resolving different versions than the one
      # that was tested proves nothing about the shipped image. The gate
      # script then asserts, against the BUILT artifact, that the A6 release
      # marker survived the bundler and that every external URL in the
      # bundle is in the documented inert allowlist.
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 >/dev/null
      - npm --prefix app/ui ci --no-audit --no-fund
      - npm --prefix app/ui run lint
      - python3 scripts/ci/ui_build_check.py --build
      # Positive AND negative controls for the gate itself (the
      # privacy_check_test.py idiom): a gate that only ever runs against a
      # healthy tree cannot show what it would REJECT, and both of this
      # one's rules fail silently when they stop working.
      - cd scripts/ci && python3 ui_build_check_test.py && cd ../..

  - name: ui-e2e
    # Browsers come from the IMAGE, never a per-run CDN download: a gate
    # that fetches ~100MB of Chromium on every push is one network blip
    # away from a red build that means nothing. The tag pins the browser
    # build alongside the Playwright version, so the two can never drift.
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    commands:
      # The app under test is the REAL panel driven by uvicorn against the
      # same FakeController the API e2e uses (scripts/ci/ui_e2e_server.py).
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 python3-venv >/dev/null
      - python3 -m venv /tmp/panelvenv
      - /tmp/panelvenv/bin/pip install --quiet -r app/requirements.txt
      - npm --prefix app/ui ci --no-audit --no-fund
      - cd app/ui && PANEL_E2E_PYTHON=/tmp/panelvenv/bin/python npx playwright test

  - name: app-lint
    image: python:3.12-slim
    commands:
      # Panel app lint (ruff pinned in app/requirements-dev.txt; config
      # scoped via app/ruff.toml).
      - pip install --quiet -r app/requirements-dev.txt
      - ruff check app

  - name: app-unit
    image: python:3.12-slim
    commands:
      # NOTE this step runs AFTER ui-build and shares its workspace, so
      # app/ui/dist exists here and the served-build assertions in
      # test_static_ui.py are live rather than skipped. Reordering the two
      # would make those assertions skip silently - they are written to
      # tolerate an unbuilt checkout, which is correct for a dev tree and
      # is exactly why the ordering matters in CI.
      # Panel unit suite (hermetic: fake controller client + tmp trees, no
      # docker/network) plus the committed OpenAPI contract gate
      # (byte-identity against a fresh export; --write regenerates).
      - pip install --quiet -r app/requirements.txt -r app/requirements-dev.txt
      - python -m pytest app/tests -q
      - python scripts/ci/panel_contract_check.py

  - name: app-e2e
    image: python:3.12-slim
    commands:
      # Real uvicorn app against an in-step fake mihomo controller +
      # webhook sink on loopback - daemonless (CI step containers stay
      # plain images), exercising the write->refresh->count-parity loop,
      # the loud failure path, and recovery end to end.
      - pip install --quiet -r app/requirements.txt -r app/requirements-dev.txt
      - python scripts/ci/panel_e2e_check.py
