<html lang="en">

    <meta charset="UTF-8" />

    <!--
      data-i18n="app_title" MUST survive `vite build` into dist/index.html.
      validate_release.sh:548 greps this exact string out of a raw wget during
      release phase A6, a REQUIRED gate, with NO JavaScript running - so it
      can never come from React. It lives in this static shell, and
      scripts/ci/ui_build_check.py asserts it against the BUILT artifact
      rather than against this file, because only the built one ships.
    -->

  </head>

    <noscript data-i18n="app_title">Gateway Panel</noscript>
    <div id="root"></div>
